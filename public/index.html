
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoTrade Login</title>
  <style>
    :root {
      --bg: #080d16;
      --header: #0d1522;
      --panel: #101a29;
      --line: #26364a;
      --green: #2ad6a0;
      --red: #ff647c;
      --muted: #9aabc2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #17344b 0%, transparent 55%),
        var(--bg);
    }
    .panel {
      width: 100%;
      max-width: 410px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 55px #0005;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 17px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--bg);
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: #07130f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>CryptoTrade</h1>
    <p>Sign in to your account</p>

    <form id="loginForm">
      <label for="username">Username / Account</label>
      <input id="username" name="username"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>

    <section id="dashboard" class="hidden">
      <h2 id="welcome"></h2>
      <p id="accountType"></p>
      <button type="button" id="logoutButton">Logout</button>
    </section>
  </main>

  <script>
    const API_BASE = "https://cryptotrade-md9y.onrender.com";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    const dashboard = document.getElementById("dashboard");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "Checking login...";
      button.disabled = true;

      const username =
        document.getElementById("username").value.trim();
      const password =
        document.getElementById("password").value;

      try {
        // Try normal user login first.
        let response = await fetch(API_BASE + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        let data = await response.json();

        // If user login fails, ask the server to validate manager login.
        if (!response.ok) {
          response = await fetch(
            API_BASE + "/api/manager/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password })
            }
          );
          data = await response.json();
        }

        if (!response.ok) {
          throw new Error(data.message || data.error ||
            "Invalid username or password.");
        }

        // Only use the role returned by the authenticated server.
        const role = String(
          data.role || data.user?.role || data.account?.role || ""
        ).toLowerCase();

        if (role !== "manager" && role !== "user") {
          throw new Error(
            "Login response does not identify the account role. API format must be checked."
          );
        }

        form.classList.add("hidden");
        dashboard.classList.remove("hidden");

        document.getElementById("welcome").textContent =
          "Welcome, " + username;
        document.getElementById("accountType").textContent =
          role === "manager"
            ? "Manager account authenticated."
            : "User account authenticated.";

        message.textContent = "";

        // Connect the relevant existing dashboard here.
        // This sample does not include your original site features.
      } catch (error) {
        message.textContent =
          error.message || "Unable to connect. Please try again.";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("logoutButton")
      .addEventListener("click", function () {
        dashboard.classList.add("hidden");
        form.classList.remove("hidden");
        form.reset();
        message.textContent = "";
      });
  </script>
</body>
</html>
